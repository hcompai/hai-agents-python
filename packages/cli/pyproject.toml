[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hai-agents-cli"
version = "0.1.0"
description = "Command-line interface for H Company's Agent API: autonomous agents powered by Holo."
requires-python = ">=3.10"
readme = "README.md"
authors = [{name = "H Company", email = "contact@hcompany.ai"}]
license = {text = "MIT"}
license-files = ["LICENSE"]
keywords = ["agent", "agents", "cli", "computer-use", "browser-use", "llm", "sdk", "h-company"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]
dependencies = [
  "hai-agents>=0.1.0",
  "typer>=0.12,<1",
  "rich>=13,<15",
  "tomli>=2.0; python_version < '3.11'",
]

[project.urls]
Homepage = "https://hcompany.ai"
Repository = "https://github.com/hcompai/hai-agents-python"
Issues = "https://github.com/hcompai/hai-agents-python/issues"
Documentation = "https://hub.hcompany.ai/agent-api"

[project.scripts]
hai = "hai_agents_cli.app:run"

[tool.hatch.build.targets.wheel]
packages = ["src/hai_agents_cli"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
