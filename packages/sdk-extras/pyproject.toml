[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hai-agents-extras"
version = "0.1.0"
description = "CLI and MCP tools for the H Company Agent API Python SDK."
requires-python = ">=3.10"
readme = "README.md"
authors = [{name = "H Company", email = "contact@hcompany.ai"}]
license = {text = "MIT"}
dependencies = [
  "fastmcp>=2.0",
  "hai-agents>=0.1.2",
  "pydantic>=2.0,<3",
  "rich>=13,<15",
  "typer>=0.12,<1",
]

[project.scripts]
hai-agents = "hai_agents_extras.cli.app:main"
hai-agents-mcp = "hai_agents_extras.mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/hai_agents_extras"]

[tool.uv.sources]
hai-agents = {path = "../..", editable = true}

[dependency-groups]
dev = [
  "pytest>=9.0.3,<10",
  "pytest-asyncio>=1.2.0,<2",
  "pytest-httpx>=0.36.0,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q -m 'not integration'"
asyncio_mode = "auto"
markers = [
  "integration: tests that hit a live Agent Platform backend (requires HAI_API_KEY_TEST)",
]
