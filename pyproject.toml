[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
agent-platform = {workspace = true}

[dependency-groups]
dev = [
  "agent-platform",
  "pytest>=9.0.3,<10",
  # Used only by tests/integration/ — read HAI_API_KEY_TEST when running locally.
  "python-dotenv>=1.2.2,<2",
  # Must match the ruff pin in config.yaml's post_hooks so local `uv sync --group dev`
  # gets the same ruff that the SDK regen uses.
  "ruff==0.15.15"
]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
# Generated code triggers many lints (missing docstrings, complex types). Apply only
# import sorting and formatting — strict lint is out of scope for generated code.
select = ["I"]
