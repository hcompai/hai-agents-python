# openapi-python-client config (loaded via --config flag).
# Generator CLI flags: --custom-template-path, --meta, --output-path, --overwrite are passed at the
# command line, NOT in this file (those are CLI-only as of 0.28.3).

project_name_override: agent-platform
package_name_override: agent_platform
package_version_override: "0.1.0"
use_path_prefixes_for_title_model_names: true
field_prefix: "field_"
post_hooks:
  # Strip the standalone-package skeleton that `--meta uv` writes alongside the
  # generated package. We install + ship via packages/sdk/pyproject.toml; these
  # would just be unused noise in every regen diff.
  - "rm -f pyproject.toml README.md .gitignore"
  # I    = isort (group/sort imports)
  # F811 = remove redundant re-imports that the Jinja templates can still emit
  # Pinning via uvx makes the regen reproducible: bare `ruff` resolves to whatever
  # is on $PATH (e.g. CI's tool venv resolves a newer ruff than a stale local
  # install), which produces drift between local and `sdk-regen-fresh` in CI.
  # --no-cache disables the .ruff_cache/ directory that would otherwise be created
  # inside src/ during regen and cause sdk-regen-fresh's diff to report drift.
  - "uvx ruff@0.15.13 check . --no-cache --fix-only --select I,F811"
  - "uvx ruff@0.15.13 format . --no-cache"
