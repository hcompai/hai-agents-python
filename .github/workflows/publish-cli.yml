name: Publish CLI

on:
  push:
    tags:
      - "cli-v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0

      - name: Verify tag matches package version
        if: github.event_name == 'push'
        run: |
          VERSION=$(grep -m1 '^version = ' packages/cli/pyproject.toml | sed -E 's/version = "(.*)"/\1/')
          TAG="${GITHUB_REF_NAME#cli-v}"
          if [ "$VERSION" != "$TAG" ]; then
            echo "::error::Tag '$TAG' does not match packages/cli/pyproject.toml version '$VERSION'."
            exit 1
          fi
          echo "Publishing hai-agents-cli $VERSION"

      - name: Build sdist and wheel
        run: uv build packages/cli --out-dir dist

      - uses: actions/upload-artifact@v5
        with:
          name: dist-cli
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: dist-cli
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
