name: Nightly drift check

# Safety net for the dispatch pipeline. Fetches the most recent OpenAPI schema
# artifact produced by agent_platform's `main` branch, regenerates the SDK, and
# opens a PR if the committed src/ has drifted. Catches missed dispatches
# (e.g., agent_platform's schema-sync workflow failed silently to dispatch).

on:
  schedule:
    # 04:00 UTC every day — after the 03:00 sdk-integration nightly cron on
    # agent_platform, so any breakage there surfaces first.
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: nightly-drift-check
  cancel-in-progress: false

jobs:
  drift-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install openapi-python-client
        run: uv tool install openapi-python-client==0.28.3

      - name: Fetch latest OpenAPI artifact from agent_platform main
        env:
          GH_TOKEN: ${{ secrets.AGP_ARTIFACT_TOKEN }}
        run: |
          # Find the most recent successful run of the schema-export workflow on main.
          run_id=$(gh run list \
            --repo hcompai/agent_platform \
            --branch main \
            --workflow sdk-sync-dispatch.yaml \
            --status success \
            --limit 1 \
            --json databaseId \
            --jq '.[0].databaseId')
          if [ -z "$run_id" ] || [ "$run_id" = "null" ]; then
            echo "::error::No successful sdk-sync-dispatch run found on agent_platform main"
            exit 1
          fi
          echo "Pulling openapi.json from agent_platform run $run_id"
          gh run download "$run_id" \
            --repo hcompai/agent_platform \
            --name openapi-schema \
            --dir /tmp/agp-schema
          python3 - <<'PY'
          import json
          with open("/tmp/agp-schema/openapi.json") as f:
              schema = json.load(f)
          assert schema.get("openapi", "").startswith("3."), f"Not OpenAPI 3.x: {schema.get('openapi')!r}"
          paths = schema.get("paths", {})
          assert len(paths) > 5, f"Suspiciously few paths in fetched schema: {len(paths)}"
          print(f"Schema OK: openapi={schema['openapi']}, {len(paths)} paths")
          PY

      - name: Regenerate SDK from fetched schema
        run: |
          uv run --no-project python scripts/prepare_openapi.py \
            /tmp/agp-schema/openapi.json /tmp/openapi.filtered.json
          rm -rf src/agent_platform/
          openapi-python-client generate \
            --path /tmp/openapi.filtered.json \
            --config config.yaml \
            --custom-template-path templates/ \
            --meta uv \
            --output-path src/ \
            --overwrite
          cp templates/__init__.py.static src/agent_platform/__init__.py
          rm /tmp/openapi.filtered.json

      - name: Refresh openapi.json snapshot
        run: cp /tmp/agp-schema/openapi.json openapi.json

      - name: Detect drift
        id: diff
        run: |
          git add -A
          if git diff --staged --quiet; then
            echo "drift=false" >> "$GITHUB_OUTPUT"
            echo "No drift detected. Committed snapshot matches latest agent_platform main."
          else
            echo "drift=true" >> "$GITHUB_OUTPUT"
            echo "## Drift detected" >> "$GITHUB_STEP_SUMMARY"
            git diff --staged --stat | tail -20 >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Open drift PR
        if: steps.diff.outputs.drift == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: drift/nightly-${{ github.run_id }}
          delete-branch: true
          commit-message: "chore(sdk): nightly drift sync against agent_platform main"
          title: "chore(sdk): nightly drift sync against agent_platform main"
          labels: auto-sync,drift
          body: |
            The nightly safety-net workflow detected drift between the committed
            `src/` (+ `openapi.json` snapshot) and the latest OpenAPI schema
            artifact published by `hcompai/agent_platform`'s `main` branch.

            This usually means the `repository_dispatch` from `hcompai/agent_platform`
            was missed (transient failure, or a force-push / out-of-band update).
            The regeneration here closes the gap.

            If this PR is opened repeatedly, investigate the dispatch path in
            `hcompai/agent_platform/.github/workflows/sdk-sync-dispatch.yaml`.
