name: Nightly drift check

# Safety net for the dispatch pipeline. Fetches the live production OpenAPI
# schema from https://agp.hcompany.ai/openapi.json, regenerates the SDK, and
# opens a PR if the committed src/ has drifted. Catches missed dispatches
# (e.g., agent_platform's schema-sync workflow failed silently, or the schema
# changed via an out-of-band deploy).

on:
  schedule:
    # 04:00 UTC every day — after the 03:00 sdk-integration nightly cron on
    # agent_platform, so any breakage there surfaces first.
    - cron: "0 4 * * *"
  workflow_dispatch:

env:
  OPENAPI_URL: "https://agp.hcompany.ai/openapi.json"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: nightly-drift-check
  cancel-in-progress: false

jobs:
  drift-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install openapi-python-client
        run: uv tool install openapi-python-client==0.28.3

      - name: Fetch live OpenAPI schema
        run: |
          curl --fail --silent --show-error "$OPENAPI_URL" -o /tmp/openapi.json
          python3 - <<'PY'
          import json
          with open("/tmp/openapi.json") as f:
              schema = json.load(f)
          assert schema.get("openapi", "").startswith("3."), f"Not OpenAPI 3.x: {schema.get('openapi')!r}"
          paths = schema.get("paths", {})
          assert len(paths) > 5, f"Suspiciously few paths in live schema: {len(paths)}"
          print(f"Live schema: openapi={schema['openapi']}, {len(paths)} paths")
          PY

      - name: Regenerate SDK from live schema
        working-directory: python
        run: |
          uv run --no-project --with pyyaml python scripts/filter_openapi.py \
            /tmp/openapi.json filter.yaml /tmp/openapi.filtered.json
          rm -rf src/agent_platform/
          openapi-python-client generate \
            --path /tmp/openapi.filtered.json \
            --config config.yaml \
            --custom-template-path templates/ \
            --meta uv \
            --output-path src/ \
            --overwrite
          cp templates/__init__.py.static src/agent_platform/__init__.py
          rm /tmp/openapi.filtered.json

      - name: Refresh openapi.json snapshot
        run: cp /tmp/openapi.json openapi.json

      - name: Detect drift
        id: diff
        run: |
          git add -A
          if git diff --staged --quiet; then
            echo "drift=false" >> "$GITHUB_OUTPUT"
            echo "No drift detected. Live schema matches committed snapshot."
          else
            echo "drift=true" >> "$GITHUB_OUTPUT"
            echo "## Drift detected" >> "$GITHUB_STEP_SUMMARY"
            git diff --staged --stat | tail -20 >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Open drift PR
        if: steps.diff.outputs.drift == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: drift/nightly-${{ github.run_id }}
          delete-branch: true
          commit-message: "chore(sdk): nightly drift sync against live schema"
          title: "chore(sdk): nightly drift sync against live schema"
          labels: auto-sync,drift
          body: |
            The nightly safety-net workflow detected drift between the committed
            `python/src/` (+ `openapi.json` snapshot) and the live schema at
            `${{ env.OPENAPI_URL }}`.

            This usually means the `repository_dispatch` from `hcompai/agent_platform`
            was missed (e.g., transient failure, or a backend deploy that bypassed
            the normal merge path). The regeneration here closes the gap.

            If this PR is opened repeatedly, investigate the dispatch path in
            `hcompai/agent_platform/.github/workflows/`.
